<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<title>CodeKids · Aprende a programar jugando</title>
<meta name="description" content="Plataforma de programación para niños: retos cortos, retroalimentación inmediata y un robot que hace lo que tú le dices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='22' width='64' height='60' rx='20' fill='%233FC1A0' stroke='%2326232E' stroke-width='6'/%3E%3Crect x='30' y='34' width='40' height='24' rx='12' fill='%2326232E'/%3E%3Ccircle cx='41' cy='46' r='5' fill='%238BF0D2'/%3E%3Ccircle cx='59' cy='46' r='5' fill='%238BF0D2'/%3E%3Ccircle cx='50' cy='16' r='7' fill='%23FFC94D' stroke='%2326232E' stroke-width='4'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<div id="app" class="app">

  <!-- ============ INICIO ============ -->
  <section id="view-home" class="view" data-view="home" aria-label="Inicio">
    <div class="wrap wrap--home" id="main"></div>
  </section>

  <!-- ============ LECCIÓN ============ -->
  <section id="view-lesson" class="view" data-view="lesson" aria-label="Lección" hidden>
    <div class="wrap wrap--lesson" id="lesson-root"></div>
  </section>

  <!-- ============ MISIÓN ============ -->
  <section id="view-mission" class="view" data-view="mission" aria-label="Misión" hidden>
    <div class="wrap wrap--mission" id="mission-root"></div>
  </section>

  <!-- ============ PROGRESO ============ -->
  <section id="view-progress" class="view" data-view="progress" aria-label="Mi progreso" hidden>
    <div class="wrap wrap--progress" id="progress-root"></div>
  </section>

  <!-- ============ REPASO / TRIVIA ============ -->
  <section id="view-quiz" class="view" data-view="quiz" aria-label="Repaso y Preguntas" hidden>
    <div class="wrap wrap--quiz" id="quiz-root"></div>
  </section>

</div>

<div id="overlay-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:sans-serif">Esta plataforma necesita JavaScript activado.</p>
</noscript>

<script src="js/engine.js?v=2"></script>
<script src="js/missions.js?v=2"></script>
<script src="js/lessons.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
